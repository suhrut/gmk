server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All /api/* requests get proxied to the backend k8s Service.
    # The Service name matches what's defined in templates/app.yaml.jinja.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Minimal cache headers so the demo doesn't surprise you with
    # stale JS during iteration.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }
}
