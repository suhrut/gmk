# examples/basics/single_ref/gmk.yml
#
# Demonstrates: single ${name} substitution. Each var references one other
# var directly. Mixes literal and ref-bearing vars.
#
# Stages exercised:    1
# Stages compatible:   1, 2, 3a, 3b+
#
# Run:
#   gmk run announce --file examples/basics/single_ref/gmk.yml

vars:
  name: "gmk"
  intro: "Welcome to ${name}"
  outro: "Goodbye from ${name}"

targets:
  announce:
    phony: true
    run: |
      echo "${intro}"
      echo "${outro}"
