# Stage 3c example #4: an nginx config rendered from declarative
# site/upstream data.
#
# What this teaches:
#   - Structured vars (Stage 3c.2): lists of nested maps work as
#     plain YAML — no Python-builds-JSON detour
#   - Jinja filters: `| default(N)` for optional values
#   - {% elif %} for branched conditionals
#   - Conditional whole sections (upstreams, tls)
#
# Try it:
#   gmk run emit-nginx
#   cat /tmp/nginx.conf

vars:
  upstreams:
    api_backend:
      - "10.0.1.10:8080"
      - "10.0.1.11:8080"
      - "10.0.1.12:8080"

  sites:
    - hostname: "api.example.com"
      port: 80
      tls: true
      locations:
        - path: "/"
          proxy_pass: "http://api_backend"
        - path: "/health"
          proxy_pass: "http://api_backend/healthz"
    - hostname: "static.example.com"
      tls: false      # port omitted → jinja `| default(80)` kicks in
      locations:
        - path: "/"
          root: "/var/www/static"

templates:
  nginx-conf:
    engine: jinja
    file: templates/nginx.jinja
    doc: |
      Renders an nginx.conf from a declarative sites + upstreams
      shape. Optional fields (worker_processes, port, tls) use
      Jinja's `| default(...)` filter.

targets:
  emit-nginx:
    run: |
      cat > /tmp/nginx.conf << 'CONF'
      ${render:nginx-conf(sites=sites, upstreams=upstreams)}
      CONF
      echo "Wrote /tmp/nginx.conf:"
      cat /tmp/nginx.conf
