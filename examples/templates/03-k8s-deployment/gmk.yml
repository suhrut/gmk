# Stage 3c example #3: Kubernetes Deployment + Service generation
# from structured config.
#
# What this teaches:
#   - Structured vars (Stage 3c.2): nested maps with lists work as
#     first-class YAML — no more "function body returns JSON"
#     workaround. The data lives where data should live.
#   - Splat (...mapvar) to pass a Map of args straight into render
#   - Jinja for-loops over .items() in YAML manifests
#   - Conditional blocks ({% if %}) for optional sections
#   - One template, multiple targets, different data
#
# Try it:
#   gmk run emit-api-deployment
#   gmk run emit-worker-deployment
#   cat /tmp/api.yml /tmp/worker.yml

vars:
  # Two service configs as plain structured YAML — what you'd
  # naturally write. No JSON-encoding-via-function-body.
  api_config:
    name: "api"
    image: "myorg/api"
    tag: "v2.3.1"
    replicas: 3
    container_port: 8080
    service_port: 80
    labels:
      tier: "backend"
      team: "platform"
    env:
      LOG_LEVEL: "info"
      DB_HOST: "db.internal"
    resources:
      cpu: "500m"
      memory: "512Mi"

  worker_config:
    name: "worker"
    image: "myorg/worker"
    tag: "v2.3.1"
    replicas: 5
    container_port: 9000
    service_port: 9000
    labels:
      tier: "background"
      team: "platform"
    # env and resources intentionally absent — template's {% if %}
    # blocks omit those sections cleanly.

templates:
  k8s-service:
    engine: jinja
    file: templates/deployment.jinja
    doc: A Kubernetes Deployment + Service for one app.

targets:
  emit-api-deployment:
    run: |
      cat > /tmp/api.yml << 'YAML'
      ${render:k8s-service(...api_config)}
      YAML
      echo "Wrote /tmp/api.yml ($(wc -l < /tmp/api.yml) lines)"

  emit-worker-deployment:
    run: |
      cat > /tmp/worker.yml << 'YAML'
      ${render:k8s-service(...worker_config)}
      YAML
      echo "Wrote /tmp/worker.yml ($(wc -l < /tmp/worker.yml) lines)"
