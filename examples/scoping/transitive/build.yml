# examples/scoping/transitive/build.yml
#
# Demonstrates: transitive includes. This file includes a/lib_a.yml,
# which in turn includes b/lib_b.yml. Vars from both should be reachable.
#
#   build.yml
#     └─ includes a/lib_a.yml      (provides var_a)
#          └─ includes ../b/lib_b.yml  (provides var_b)
#
# Stages exercised:    2
# Stages compatible:   2, 3a, 3b+
#
# Run:
#   gmk run reach --file examples/scoping/transitive/build.yml

includes:
  - "./a/lib_a.yml"

vars:
  local_combined: "${var_a}+${var_b}"

targets:
  reach:
    phony: true
    run: |
      echo "var_a=${var_a}"             # from a/lib_a.yml
      echo "var_b=${var_b}"             # from b/lib_b.yml (transitive)
      echo "combined=${local_combined}"
