# Stage 3b example: prelude bindings — declarative gmk-time evaluation
# that the body reads from $GMK_PRELUDE.
#
# Demonstrates:
#   - prelude: block on both targets and functions
#   - prelude bindings referencing each other (order-sensitive)
#   - pure-data functions: prelude with no body returns the prelude as the result
#
# Try:
#   gmk call config                     # returns the prelude as a map
#   gmk call deploy-version env=prod    # uses prelude for the computed tag
#   gmk run release                     # target with prelude

functions:
  config:
    doc: "Static project config, exposed as a map."
    # No script — this is a pure-data function. The prelude IS the result.
    prelude:
      project_name: "gmk-demo"
      version: "1.2.3"
      registry: "registry.example.com"

  deploy-version:
    doc: "Compute a deployment tag from env and version."
    params:
      - name: env
        type: string
        default: "dev"
    prelude:
      version: "1.2.3"
      git_sha: "abc1234"
      tag: "${env}-${version}-${git_sha}"
    script: |
      # The prelude has already computed `tag` using gmk-time substitution.
      tag=$(p_get tag)
      r_set_json "{\"deployment_tag\": \"${tag}\", \"env\": \"$(a_get env)\"}"

targets:
  release:
    doc: "Release target with a prelude — values computed at gmk-time."
    prelude:
      version: "1.2.3"
      timestamp: "${env:BUILD_TIME:-unknown}"
    script: |
      echo "Releasing version $(p_get version) at $(p_get timestamp)"
