# examples/basics/literals/build.yml
#
# Demonstrates: plain literal var values. No expressions, no interpolation.
# These vars are stored as VarLiteral kind — the expression parser sees
# no '$' and short-circuits to the literal fast path.
#
# Stages exercised:    1
# Stages compatible:   1, 2, 3a, 3b+
#
# Run:
#   gmk run say --file examples/basics/literals/build.yml

vars:
  greeting: "hello"
  subject: "world"
  punctuation: "!"

targets:
  say:
    phony: true
    run: |
      echo "${greeting} ${subject}${punctuation}"
