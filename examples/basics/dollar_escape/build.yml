# examples/basics/dollar_escape/build.yml
#
# Demonstrates: $$ escape for a literal dollar sign in YAML var values.
# Useful when you need a real $ in a string without triggering ${...}
# substitution.
#
# Stages exercised:    1
# Stages compatible:   1, 2, 3a, 3b+
#
# Run:
#   gmk run show --file examples/basics/dollar_escape/build.yml

vars:
  currency: "USD"
  price_tag: "$$5.99 ${currency}"
  shell_template: "echo $$PATH"

targets:
  show:
    phony: true
    run: |
      echo "price: ${price_tag}"
      echo "template: ${shell_template}"
