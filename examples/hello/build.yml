# examples/hello/build.yml
#
# Stage 3a demonstration: the expression language.
#
# Compared to Stage 2, var values can now use a full expression grammar:
#   - typed refs:    ${env:NAME}, ${ctx:NAME}, ${var:NAME}
#   - modifiers:     ${name:-default}  ${name:?required}  ${name:+alt}
#   - pipelines:     ${name | upper | trim}
#   - functions:     upper lower trim trim_left trim_right
#                    to_string to_int len
#                    starts_with ends_with contains replace
#                    default coalesce join
#   - comparisons:   ${env == "prod"}
#   - parentheses:   ${(env:USER:-anon) | upper}
#
# Var declaration order in this file is now preserved exactly as written
# (Stage 2 sorted alphabetically — that's gone). Source positions on every
# value mean error messages can pinpoint file:line:col.
#
# Try it:
#
#   ./gmk run hello --file examples/hello/build.yml
#   ./gmk dryrun hello --file examples/hello/build.yml
#
# Set GMK_LOG_LEVEL or USER to see the modifier/pipeline output change.
# Materialized scripts land under:
#
#   examples/hello/.gmk-cache/code/local/examples/hello/build.yml/*.sh

includes:
  - "./vars/common.yml"

vars:
  # Plain literal — VarLiteral, no expression parse needed.
  greeting: "hello"
  target: "world"

  # Typed ref with default modifier (bash :-): falls back if USER is unset.
  user: "${env:USER:-anonymous}"

  # Required modifier (bash :?): would error with this message if unset.
  # GMK_LOG_LEVEL has a sensible :- default so this stays a passing example.
  log_level: "${env:GMK_LOG_LEVEL:-info}"

  # Pipeline + function: upper-case the greeting.
  shout: "${greeting | upper}"

  # Mixed template + pipeline: text around a substitution.
  banner: "=== ${target | upper} ==="

# Second vars block — declaration order across blocks is preserved.
vars_1:
  # Comparison producing a bool, then coerced to string in the message.
  env_kind: "${env:USER == \"root\" }"

  # Composed expression: nested var refs + pipeline.
  full_greeting: "${greeting}, ${user}, welcome to ${target | upper}!"

  build_note: "running from ${project_name}"

targets:
  # A simple preparation step. Phony — no on-disk output.
  prep:
    phony: true
    run: |
      echo "[prep] starting build pipeline"
      echo "[prep] log_level=${log_level}"

  # The main target. Showcases vars resolving expression nodes.
  hello:
    deps: [prep]
    env:
      BUILD_NOTE: "${build_note}"
      BANNER: "${banner}"
      SHOUT: "${shout}"
    cwd: "/tmp"
    run: |
      echo "${full_greeting}"
      echo "$BANNER"
      echo "$SHOUT"
      echo "$BUILD_NOTE"
      echo "working dir: $(pwd)"

  # Showcase: required modifier. Uncomment and unset a var to see the
  # diagnostic with file:line:col + variable name.
  #
  # check_token:
  #   run: |
  #     echo "${env:DEPLOY_TOKEN:?DEPLOY_TOKEN must be set for deploys}"
