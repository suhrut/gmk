# examples/hello/build.yml
#
# Stage 2 demonstration:
#   - includes:    pull in vars/common.yml
#   - vars + vars_1: multiple vars blocks merged in numeric order
#   - deps:        target dependency chain
#   - env:         per-target environment with var substitution
#   - cwd:         per-target working directory
#
# Try it:
#
#   ./gmk run hello --file examples/hello/build.yml
#   ./gmk dryrun hello --file examples/hello/build.yml
#
# The materialized scripts land under:
#
#   examples/hello/.gmk-cache/code/local/examples/hello/build.yml/*.sh
#
# Each script is standalone — cat or bash them directly.

includes:
  - "./vars/common.yml"

vars:
  greeting: "hello"
  target: "world"

# Second vars block (suffix _1) overrides and extends.
# Use vars_1, vars_2, ... — the dot suffix (vars.1) is reserved for
# future folder-namespacing of vars.
vars_1:
  full_greeting: "${greeting} from gmk, ${target}!"
  build_note: "running from ${project_name}"

targets:
  # A simple preparation step with no deps. Demonstrates phony semantics.
  prep:
    phony: true
    run: |
      echo "[prep] starting build pipeline"

  # The main target. Depends on prep, uses env + cwd.
  hello:
    deps: [prep]
    env:
      BUILD_NOTE: "${build_note}"
      EXTRA: "stage 2 is running"
    cwd: "/tmp"
    run: |
      echo "${full_greeting}"
      echo "$BUILD_NOTE"
      echo "$EXTRA"
      echo "working dir: $(pwd)"
