# Stage 3b example: a typed function with declared parameters and result.
#
# Demonstrates:
#   - functions: top-level block
#   - typed params with defaults
#   - declared result type and doc
#   - lib.sh helpers (p_get, a_get, r_set) sourced automatically
#
# Try:
#   gmk call greet
#   gmk call greet who="Bengaluru"
#   gmk call greet who=Sam shout=true
#   gmk call greet --json '{"who":"world","shout":true}'

functions:
  greet:
    doc: "Greet someone, optionally shouting."
    params:
      - name: who
        type: string
        default: "world"
        doc: "Person/thing to greet."
      - name: shout
        type: bool
        default: "false"
        doc: "If true, return greeting in uppercase."
    result:
      type: string
      doc: "Greeting text."
    script: |
      who=$(a_get who)
      should_shout=$(a_get shout)
      msg="hello, ${who}!"
      if [ "$should_shout" = "true" ]; then
        msg=$(echo "$msg" | tr '[:lower:]' '[:upper:]')
      fi
      r_set "$msg"
