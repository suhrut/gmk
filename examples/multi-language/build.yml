# Stage 3b example: functions in different languages, sharing the same
# JSON-in/JSON-out contract.
#
# All four functions take the same input shape and return the same output
# shape. The interpreter is the only thing that changes.
#
# Try:
#   gmk call sum-bash a=3 b=4
#   gmk call sum-python a=3 b=4
#   gmk call sum-node a=3 b=4
#   gmk call sum-perl a=3 b=4

functions:
  sum-bash:
    doc: "Compute a + b using bash."
    lang: bash
    params:
      - name: a
        type: int
      - name: b
        type: int
    result:
      type: int
    script: |
      a=$(a_get a)
      b=$(a_get b)
      r_set_json "$((a + b))"

  sum-python:
    doc: "Compute a + b using Python."
    lang: python
    params:
      - name: a
        type: int
      - name: b
        type: int
    result:
      type: int
    script: |
      with open(os.environ["GMK_ARGS"]) as f:
          args = json.load(f)
      with open(os.environ["GMK_RESULT"], "w") as f:
          json.dump(args["a"] + args["b"], f)

  sum-node:
    doc: "Compute a + b using Node.js."
    lang: node
    params:
      - name: a
        type: int
      - name: b
        type: int
    result:
      type: int
    script: |
      const fs = require('fs');
      const args = JSON.parse(fs.readFileSync(process.env.GMK_ARGS, 'utf8'));
      fs.writeFileSync(process.env.GMK_RESULT, JSON.stringify(args.a + args.b));

  sum-perl:
    doc: "Compute a + b using Perl."
    lang: perl
    params:
      - name: a
        type: int
      - name: b
        type: int
    result:
      type: int
    script: |
      use strict;
      open(my $afh, '<', $ENV{GMK_ARGS}) or die "open args: $!";
      my $json_in = do { local $/; <$afh> };
      my ($a) = $json_in =~ /"a"\s*:\s*(-?\d+)/;
      my ($b) = $json_in =~ /"b"\s*:\s*(-?\d+)/;
      open(my $rfh, '>', $ENV{GMK_RESULT}) or die "open result: $!";
      print $rfh ($a + $b);
