# examples/targets/cwd/gmk.yml
#
# Demonstrates: per-target `cwd:` (working directory). The `run:` script
# executes from that directory. /tmp is used as a safe, always-present
# location across Unix systems.
#
# Stages exercised:    1
# Stages compatible:   1, 2, 3a, 3b+
#
# Run:
#   gmk run where --file examples/targets/cwd/gmk.yml

vars:
  work_dir: "/tmp"

targets:
  where:
    phony: true
    cwd: "${work_dir}"
    run: |
      echo "running from: $(pwd)"
      echo "expected: ${work_dir}"
