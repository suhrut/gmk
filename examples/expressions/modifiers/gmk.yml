# examples/expressions/modifiers/gmk.yml
#
# Demonstrates: bash-compatible modifiers inside ${...}:
#   ${X:-default}  - use default if X is unset OR empty
#   ${X:+alt}      - use alt if X is set AND non-empty
#   ${X:?msg}      - error with msg if X is unset OR empty
#
# Semantics match bash exactly: unset OR empty triggers :- and :?.
# Note: this example does NOT use :? on an unset var because that would
# intentionally fail the build. See the commented-out target for that.
#
# Stages exercised:    3a
# Stages compatible:   3a, 3b+
#
# Run:
#   gmk run show --file examples/expressions/modifiers/gmk.yml

vars:
  set_var: "i-am-set"
  empty_var: ""

  # :- default: fires for unset_var (undefined) and empty_var (empty).
  fallback_for_unset: "${unset_var:-was-unset}"
  fallback_for_empty: "${empty_var:-was-empty}"
  passthrough:        "${set_var:-would-not-fire}"

  # :+ alternate: fires for set_var; gives empty for unset/empty.
  alt_for_set:        "${set_var:+yes-set}"
  alt_for_empty:      "${empty_var:+would-not-fire}"

targets:
  show:
    phony: true
    run: |
      echo "fallback_for_unset=${fallback_for_unset}"
      echo "fallback_for_empty=${fallback_for_empty}"
      echo "passthrough=${passthrough}"
      echo "alt_for_set=${alt_for_set}"
      echo "alt_for_empty=${alt_for_empty}"

  # Uncomment to see the :? required-with-location diagnostic.
  # demand:
  #   phony: true
  #   run: |
  #     echo "${MISSING:?MISSING must be set in env}"
