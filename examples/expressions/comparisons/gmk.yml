# examples/expressions/comparisons/gmk.yml
#
# Demonstrates: == and != equality operators inside ${...}.
# Result is a bool that stringifies to "true" or "false".
#
# Comparison coerces operands to a common type:
#   string vs string  - byte equality
#   int vs int        - numeric equality
#   mixed             - both coerced to string before compare
#
# In Stage 4 these same operators become first-class predicates inside
# `when`, `all`, `any` blocks — but the grammar is identical.
#
# Stages exercised:    3a
# Stages compatible:   3a, 3b+
#
# Run:
#   gmk run cmp --file examples/expressions/comparisons/gmk.yml

vars:
  env_name: "prod"
  count: "3"

  is_prod:     "${env_name == \"prod\"}"
  is_dev:      "${env_name == \"dev\"}"
  not_staging: "${env_name != \"staging\"}"
  count_is_3:  "${count == \"3\"}"

targets:
  cmp:
    phony: true
    run: |
      echo "is_prod=${is_prod}"
      echo "is_dev=${is_dev}"
      echo "not_staging=${not_staging}"
      echo "count_is_3=${count_is_3}"
